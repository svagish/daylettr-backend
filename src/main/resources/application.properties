# Local secrets from ./.env (git-ignored, optional — defaults apply if absent)
spring.config.import=optional:file:.env[.properties]

spring.application.name=daylettr
spring.datasource.url=jdbc:mysql://localhost:3306/daylettrdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update